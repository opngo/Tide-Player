appId: dev.tide.audiobook
productName: Tide
copyright: Copyright © 2026 Opngo

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - build-resources/**/*
  - package.json

asar: true

win:
  icon: build-resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tide
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

mac:
  icon: build-resources/icon.png
  category: public.app-category.music
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  icon: build-resources/icon.png
  category: AudioVideo
  maintainer: Opngo <Opngo@users.noreply.github.com>
  synopsis: Minimalist Audiobook Player with M4B Chapter Sync & Real-Time FFT
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

publish:
  provider: github
  owner: Opngo
  repo: Tide-Player
  releaseType: release
